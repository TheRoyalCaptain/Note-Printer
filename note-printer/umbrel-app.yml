manifestVersion: 1
id: note-printer
category: files
name: Note Printer
version: "0.4.0"
tagline: Print je notities direct op een DYMO-label
description: >-
  Schrijf een korte notitie op je telefoon of computer en print die rechtstreeks
  op een via USB aangesloten DYMO LabelWriter 400 of 450. Bekijk vooraf het
  99014-label, kies het aantal exemplaren en voeg optioneel datum en tijd toe.
releaseNotes: >-
  v0.4.0 voegt vijf labelsjablonen toe, plus eigen sjablonen met indeling,
  koptekst en lettergrootte. Bewaar en heropen notities; bekijk de printerwachtrij
  en afdrukgeschiedenis, en print eerdere labels opnieuw. Voeg Aan, Van en een
  afspraakdatum toe, of kies een zwart-witfoto of pictogram. Een iPhone-opdracht
  kan tekst in de editor openen, waarna je de afdruk bevestigt.
developer: Kevin van Krugten
