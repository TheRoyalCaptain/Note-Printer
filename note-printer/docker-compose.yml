services:
  app_proxy:
    environment:
      APP_HOST: note-printer_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/theroyalcaptain/note-printer:0.1.0
    init: true
    restart: on-failure
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      - "c 189:* rwm"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
