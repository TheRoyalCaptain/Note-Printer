<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121d2b">
  <title>Note Printer</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f4f6fb;background:#0c1420;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0%,#1c3552 0%,#0c1420 50%)}
    header,main{max-width:1080px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:34px}
    h1{font-size:clamp(29px,5vw,44px);letter-spacing:-.045em;margin:4px 0 0}h2{font-size:19px;margin:0 0 17px}p{color:#a8b4c4}
    .eyebrow{color:#79cbb5;letter-spacing:.16em;text-transform:uppercase;font-weight:800;font-size:11px}.status{border-radius:50px;background:#202e3e;padding:10px 14px;color:#d8e2ed;font-size:13px;white-space:nowrap}.status.good{background:#164536;color:#a4f0d3}
    main{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.8fr);gap:22px}.panel{padding:27px;border-radius:24px;background:#152131;border:1px solid #2c394b;box-shadow:0 16px 50px #050c1740}
    label{font-size:14px;font-weight:700;display:block;margin:19px 0 8px}input[type=text],textarea,input[type=number]{width:100%;font:inherit;color:#fff;border:1px solid #44536a;border-radius:12px;background:#0d1725;padding:13px 14px;outline:none}textarea{min-height:220px;resize:vertical;line-height:1.5}input:focus,textarea:focus{border-color:#79cbb5;box-shadow:0 0 0 3px #79cbb520}
    .row{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin:20px 0}.row label{margin:0}.copies{width:88px!important}.check{display:flex;align-items:center;gap:8px}.check input{accent-color:#79cbb5;width:18px;height:18px}
    button{appearance:none;border:0;border-radius:13px;padding:14px 17px;font:inherit;font-weight:800;cursor:pointer;background:#78d5b9;color:#08251e}button:disabled{opacity:.5;cursor:wait}.secondary{background:#2e4054;color:#e9f1f5} .buttons{display:flex;flex-wrap:wrap;gap:10px}
    #message{min-height:22px;font-size:14px;margin:16px 0 0}.error{color:#ffaaa7}.success{color:#95e9c8}
    .preview-area{display:grid;place-items:center;background:#0b1726;border:1px dashed #475a72;border-radius:18px;padding:25px;min-height:490px}.paper{width:228px;height:426px;background:white;color:#17202b;padding:17px;box-shadow:0 16px 35px #0005;overflow:hidden;display:flex;flex-direction:column;overflow-wrap:anywhere}.paper strong{font-size:19px;line-height:1.22;white-space:pre-wrap}.paper hr{width:100%;border:0;border-top:1px solid #aaa;margin:13px 0}.paper .content{font-size:13px;line-height:1.35;white-space:pre-wrap;overflow:hidden}.paper small{margin-top:auto;color:#666;font-size:10px;padding-top:10px}.hint{font-size:12px;line-height:1.5;margin:15px 0 0}
    @media(max-width:760px){main{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.panel{padding:20px}.preview-area{min-height:470px}}
  </style>
</head>
<body>
  <header><div><div class="eyebrow">Jouw Umbrel · DYMO 400/450</div><h1>Note Printer</h1><p>Typ een notitie. Print hem meteen als label.</p></div><div id="status" class="status" role="status">Printer controleren…</div></header>
  <main>
    <section class="panel"><h2>Nieuwe notitie</h2><form id="form"><label for="title">Titel <span style="font-weight:400;color:#a8b4c4">(optioneel)</span></label><input id="title" type="text" maxlength="80" placeholder="Bijvoorbeeld: Niet vergeten"><label for="body">Notitie</label><textarea id="body" maxlength="2500" placeholder="Schrijf hier wat je wilt printen…"></textarea><div class="row"><label for="copies">Aantal</label><input class="copies" id="copies" type="number" min="1" max="10" value="1"><label class="check" for="date"><input id="date" type="checkbox">Datum en tijd tonen</label></div><div class="buttons"><button id="print" type="submit">Print notitie</button><button id="preview-pdf" class="secondary" type="button">Exact voorbeeld (PDF)</button></div><div id="message" aria-live="polite"></div></form></section>
    <section class="panel"><h2>Labelvoorbeeld</h2><div class="preview-area"><div class="paper"><strong id="preview-title"></strong><hr id="rule" hidden><div class="content" id="preview-body"></div><small id="preview-date"></small></div></div><p class="hint">Voor DYMO 99014, circa 54 × 101 mm. Open “Exact voorbeeld” om de definitieve indeling te zien voordat je print.</p></section>
  </main>
  <script>
    const $=id=>document.getElementById(id), fields=['title','body','copies','date'];
    const data=()=>({title:$('title').value,body:$('body').value,copies:Number($('copies').value),date:$('date').checked});
    function update(){const d=data();$('preview-title').textContent=d.title;$('rule').hidden=!d.title||!d.body;$('preview-body').textContent=d.body;$('preview-date').textContent=d.date?new Date().toLocaleString('nl-NL',{dateStyle:'short',timeStyle:'short'}):''}
    fields.forEach(id=>$(id).addEventListener('input',update));update();
    async function status(){try{const r=await fetch('api/status');const j=await r.json();$('status').textContent=j.message+(j.model?' · '+j.model:'');$('status').className='status'+(j.connected?' good':'')}catch{$('status').textContent='Printerstatus niet beschikbaar'}}status();setInterval(status,15000);
    function message(text,error=false){$('message').textContent=text;$('message').className=error?'error':'success'}
    async function action(kind){const btn=$(kind==='print'?'print':'preview-pdf');const tab=kind==='preview'?window.open('','_blank'):null;btn.disabled=true;message('Bezig…');try{const r=await fetch('api/'+kind,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data())});if(!r.ok){const j=await r.json();throw Error(j.error||'Er is iets misgegaan.')}if(kind==='preview'){const blob=await r.blob();const url=URL.createObjectURL(blob);if(tab){tab.location.href=url}else{const link=document.createElement('a');link.href=url;link.download='notitie.pdf';link.click()}setTimeout(()=>URL.revokeObjectURL(url),60000);message('Voorbeeld geopend.')}else{const j=await r.json();message(j.message+'.');status()}}catch(e){if(tab)tab.close();message(e.message,true)}finally{btn.disabled=false}}
    $('form').addEventListener('submit',e=>{e.preventDefault();action('print')});$('preview-pdf').addEventListener('click',()=>action('preview'));
  </script>
</body>
</html>
